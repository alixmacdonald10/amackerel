[package]
name = "amackerel"
version = "0.2.0"
edition = "2021"

[dependencies]
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.5", features = ["tailwind"] }

[build-dependencies]
topcoat = { version = "0.5", default-features = false, features = ["tailwind"] }

[package]
name = "amackerel"
version = "0.2.5"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
config = "0.15.25"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.6", features = ["tailwind"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
topcoat = { version = "0.6", default-features = false, features = ["tailwind"] }

[dev-dependencies]
temp-env = "0.3.6"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
strip = "debuginfo"
lto = "fat"
opt-level = 3

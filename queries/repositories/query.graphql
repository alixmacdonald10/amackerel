query RepositoriesQuery($searchQuery: String!) {
  search(
    query: $searchQuery 
    type: REPOSITORY
    first: 100
  ) {
    nodes {
      __typename
      ... on Repository {
        name
        description
        url
        stargazerCount
        primaryLanguage { name }
        languages(first: 10) { nodes { name } }
      }
    }
  }
}
